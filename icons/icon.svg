  <!-- feed lines -->
  <rect x="32" y="44" width="64" height="11" rx="5.5" fill="#0f1419"/>
  <rect x="32" y="66" width="64" height="11" rx="5.5" fill="#0f1419"/>
  <rect x="32" y="88" width="40" height="11" rx="5.5" fill="#0f1419"/>
  <!-- "new" count dot -->
  <circle cx="97" cy="33" r="18" fill="#0b0f14" opacity="0.16"/>
  <circle cx="96" cy="32" r="17" fill="#f4212e" stroke="#ffffff" stroke-width="3"/>
</svg>
