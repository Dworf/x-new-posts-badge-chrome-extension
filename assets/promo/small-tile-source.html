<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .tile{width:440px;height:280px;box-sizing:border-box;
    background:linear-gradient(135deg,#e9f3fb 0%,#ffffff 100%);
    display:flex;align-items:center;gap:26px;padding-left:34px;
    font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;}
  .txt h1{margin:0;font-size:29px;font-weight:700;color:#0f1419;letter-spacing:-.2px}
  .txt p{margin:8px 0 0;font-size:16px;color:#536471;line-height:1.4}
</style></head><body>
  <div class="tile">
    <svg width="120" height="120" viewBox="0 0 128 128" style="flex:0 0 auto">
      <rect x="1" y="1" width="126" height="126" rx="27" fill="#ffffff" stroke="#cfd9de" stroke-width="2"/>
      <rect x="32" y="44" width="64" height="11" rx="5.5" fill="#0f1419"/>
      <rect x="32" y="66" width="64" height="11" rx="5.5" fill="#0f1419"/>
      <rect x="32" y="88" width="40" height="11" rx="5.5" fill="#0f1419"/>
      <circle cx="97" cy="33" r="18" fill="#0b0f14" opacity="0.16"/>
      <circle cx="96" cy="32" r="17" fill="#f4212e" stroke="#ffffff" stroke-width="3"/>
    </svg>
    <div class="txt">
      <h1>X New-Posts Badge</h1>
      <p>See how many new posts are waiting<br>&mdash; without keeping X open.</p>
    </div>
  </div>
</body></html>
